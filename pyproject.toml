[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creditcheck"
version = "0.1.0"
description = "Did the merge keep the contributor's name? Flags re-authored commits and squash merges without Co-authored-by trailers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Athalla Jovian Maharsa" }]
keywords = ["credit", "co-authored-by", "git", "squash", "open-source", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/athallajovian9-cyber/creditcheck"
Issues = "https://github.com/athallajovian9-cyber/creditcheck/issues"

[project.scripts]
creditcheck = "creditcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["creditcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
